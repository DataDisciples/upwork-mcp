name: upwork-smoke-test

# Verifies UPWORK_* secrets reach Upwork. Skips silently if credentials
# aren't yet provisioned (Upwork keys are pending approval at the time of
# this workflow's first commit). Same pattern as SpotSee's domo-smoke-test.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/upwork_client.py"
      - "scripts/upwork_smoke_test.py"
      - ".github/workflows/upwork-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run smoke test
        env:
          UPWORK_CLIENT_ID: ${{ secrets.UPWORK_CLIENT_ID }}
          UPWORK_CLIENT_SECRET: ${{ secrets.UPWORK_CLIENT_SECRET }}
          UPWORK_REFRESH_TOKEN: ${{ secrets.UPWORK_REFRESH_TOKEN }}
          UPWORK_ACCESS_TOKEN: ${{ secrets.UPWORK_ACCESS_TOKEN }}
          UPWORK_ORG_UID: ${{ secrets.UPWORK_ORG_UID }}
          UPWORK_TOKEN_FILE: ""
        run: |
          if [ -z "$UPWORK_CLIENT_ID" ] || [ -z "$UPWORK_REFRESH_TOKEN" ]; then
            echo "::warning::UPWORK_* secrets not set; skipping (creds pending Upwork approval)."
            exit 0
          fi
          python scripts/upwork_smoke_test.py
